
name: Deploy Shop App

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /var/www/estore/e_store_mini_apps
            git pull origin main
            rm -rf dist
            npm ci
            npm run build
            # Recreate nginx so its bind mount picks up the new dist inode;
            # without this, the container keeps serving the now-deleted
            # directory and returns 403 "directory index ... is forbidden".
            cd /var/www/estore/e_store_back
            docker compose up -d --force-recreate nginx
            echo "Shop app deployed!"